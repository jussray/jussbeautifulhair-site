name: Deployment Boundary

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-deployment-boundary:
    name: Block temporary, private, and legacy KV paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Budget-mode delegation
        run: |
          echo "Deployment Boundary no longer repeats npm ci, build, and boundary scans."
          echo "The required pre-build and post-build boundary proof now runs once in the Quality Gate storefront-proof job."
