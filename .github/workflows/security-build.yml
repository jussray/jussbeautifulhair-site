name: Security Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: MCP guardrails, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Budget-mode delegation
        run: |
          echo "Security Build no longer repeats npm ci, MCP, typecheck, and build."
          echo "The required security, typecheck, and build proof now runs once in the Quality Gate storefront-proof job."
