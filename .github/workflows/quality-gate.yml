name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: "Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run TypeScript with retained failure evidence
        shell: bash
        run: |
          set +e
          npm run check > typecheck-output.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "::group::TypeScript failure tail"
            tail -n 240 typecheck-output.log
            echo "::endgroup::"
            exit $status
          fi
          cat typecheck-output.log
      - name: Upload TypeScript failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-failure-evidence
          path: typecheck-output.log
          if-no-files-found: error
          retention-days: 14

  build:
    name: "Production Build"
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  sonarqube:
    name: "SonarQube – Storefront Standard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Detect SonarQube configuration
        id: sonar_config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [[ -n "$SONAR_TOKEN" && -n "$SONAR_HOST_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube is not configured; skipping the optional vendor gate."
          fi
      - name: SonarQube Scan
        if: steps.sonar_config.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=jussbeautifulhair-site
            -Dsonar.qualitygate.wait=true
