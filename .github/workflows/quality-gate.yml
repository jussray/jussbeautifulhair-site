name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  storefront-proof:
    name: Storefront proof — AI, type, lint, unit, security, browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies once
        run: npm ci
      - name: Verify AI skill contract
        run: npm run verify:ai-skill-contract
      - name: Typecheck
        run: npm run check
      - name: Lint storefront without repeating typecheck
        run: node scripts/lint-storefront.mjs
      - name: Run repository contract tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.txt
          if-no-files-found: error
          retention-days: 7
      - name: Verify source and configuration boundary before build
        run: npm run security:deploy-boundary
      - name: Build public storefront
        run: npm run build
      - name: Verify public build boundary after build
        run: npm run security:deploy-boundary
      - name: Install pinned Playwright verifier
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.61.1
      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Verify blended moat and product separation
        run: npm run verify:playwright

  sonarqube:
    name: SonarQube – Storefront Standard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stop if optional scanner is not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SonarQube is not configured for this repository; required local quality gates run in storefront-proof."
      - uses: actions/setup-node@v4
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: >
            -Dsonar.projectKey=jussbeautifulhair-site
            -Dsonar.qualitygate.wait=true
