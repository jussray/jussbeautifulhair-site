name: Founder Funnel Exact-Head Gate

on:
  pull_request:
    paths:
      - "worker/entry.ts"
      - "wrangler.toml"
      - "client/src/lib/funnel.ts"
      - "client/src/pages/Product.tsx"
      - "client/src/pages/Checkout.tsx"
      - "scripts/shopify-production-playwright.mjs"
      - "scripts/verify-founder-funnel-readback.mjs"
      - "tests/founder-funnel-readback-contract.test.mjs"
      - ".github/workflows/founder-funnel-exact-head.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: founder-funnel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify Founder Funnel exact-release readback
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Founder Funnel readback contracts
        run: node --test tests/founder-funnel-readback-contract.test.mjs

  production-readback:
    name: Verify Founder Funnel production readback
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-22.04
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Wait for exact production Shopify proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..180}; do
            checks="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/check-runs" || true)"

            state="$(printf '%s' "$checks" | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                try {
                  const data = JSON.parse(raw);
                  const runs = (data.check_runs || []).filter(
                    (run) => run.name === "Verify tokenless Shopify checkout bridge"
                  );
                  if (runs.some((run) => run.status === "completed" && run.conclusion === "success")) {
                    console.log("success");
                    return;
                  }
                  if (runs.some((run) => run.status === "completed" && run.conclusion && run.conclusion !== "success")) {
                    console.log("failure");
                    return;
                  }
                  console.log("pending");
                } catch {
                  console.log("pending");
                }
              });
            ')"

            if [ "$state" = "success" ]; then
              printf 'Exact production Shopify proof is green for %s\n' "$EXPECTED_HEAD_SHA"
              break
            fi
            if [ "$state" = "failure" ]; then
              printf 'Exact production Shopify proof failed for %s\n' "$EXPECTED_HEAD_SHA" >&2
              exit 1
            fi
            if [ "$attempt" -eq 180 ]; then
              printf 'Exact production Shopify proof did not complete for %s\n' "$EXPECTED_HEAD_SHA" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Verify production Cloudflare credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify exact-release Analytics Engine readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: node scripts/verify-founder-funnel-readback.mjs

      - name: Upload Founder Funnel readback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-funnel-readback-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/founder-funnel-readback/
          if-no-files-found: warn
          retention-days: 30
