name = "jussbeautifulhair-site"
main = "worker/entry.ts"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

# Production is served only through the approved custom storefront hostname.
# Keep both settings explicit so dashboard toggles are not re-enabled on deploy.
workers_dev = false
preview_urls = false

[build]
command = "npm run build"

[vars]
STORE_ORIGIN = "https://jussbeautifulhair.com"
ENABLE_LEGACY_STRIPE_CHECKOUT = "false"

[assets]
directory = "dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Public storefront security and Content-Signal headers are applied by worker/index.ts.
# Run the Worker before every asset response so those headers cannot be bypassed.
run_worker_first = true
