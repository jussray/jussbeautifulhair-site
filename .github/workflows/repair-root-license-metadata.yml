name: Repair root license metadata

on:
  push:
    branches:
      - strategy/2026-under-the-radar-signals

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy/2026-under-the-radar-signals
          fetch-depth: 0

      - name: Synchronize package-lock root license
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!lock.packages || !lock.packages['']) {
            throw new Error('package-lock.json has no root package entry');
          }
          lock.packages[''].license = pkg.license;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock root license already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: synchronize package-lock license metadata'
          git push origin HEAD:strategy/2026-under-the-radar-signals
