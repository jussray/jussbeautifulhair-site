name: Security Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          set -o pipefail
          npm run check 2>&1 | tee ci-diagnostics/typecheck.log
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          set -o pipefail
          npm run build 2>&1 | tee ci-diagnostics/build.log
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-check-diagnostics
          path: ci-diagnostics/
          if-no-files-found: error
          retention-days: 3
      - name: Enforce check results
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.typecheck.outcome }}" != "success" || "${{ steps.build.outcome }}" != "success" ]]; then
            echo "Typecheck or build failed. See the bounded diagnostics artifact."
            exit 1
          fi
