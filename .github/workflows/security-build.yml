name: Security Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: security-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: MCP guardrails, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: MCP configuration guardrails
        id: mcp
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          set -o pipefail
          npm run verify:mcp 2>&1 | tee ci-diagnostics/mcp-guardrails.log
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          set -o pipefail
          npm run check 2>&1 | tee ci-diagnostics/typecheck.log
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          set -o pipefail
          npm run build 2>&1 | tee ci-diagnostics/build.log
      - name: Upload bounded failure diagnostics
        if: ${{ steps.mcp.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.build.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: storefront-check-diagnostics
          path: ci-diagnostics/
          if-no-files-found: error
          retention-days: 3
      - name: Enforce check results
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.mcp.outcome }}" != "success" || "${{ steps.typecheck.outcome }}" != "success" || "${{ steps.build.outcome }}" != "success" ]]; then
            echo "MCP guardrails, typecheck, or build failed. See the bounded diagnostics artifact."
            exit 1
          fi
