name: Front Door Production Activation

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact 40-character main SHA approved for activation"
        required: true
        type: string
      confirm_domain:
        description: "Type jussbeautifulhair.com"
        required: true
        type: string
      confirm_action:
        description: "Type activate-frontdoor"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ inputs.expected_main_sha }}
  LIVE_STOREFRONT_URL: https://jussbeautifulhair.com
  WRANGLER_VERSION: 4.114.0

concurrency:
  group: frontdoor-production-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Verify, activate, and browser-prove branded front door
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify explicit activation authority
        env:
          CONFIRM_DOMAIN: ${{ inputs.confirm_domain }}
          CONFIRM_ACTION: ${{ inputs.confirm_action }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$EXPECTED_HEAD_SHA" = "$actual"
          test "${#EXPECTED_HEAD_SHA}" -eq 40
          test "$CONFIRM_DOMAIN" = "jussbeautifulhair.com"
          test "$CONFIRM_ACTION" = "activate-frontdoor"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked storefront dependencies
        run: npm ci

      - name: Run repository contract suite
        run: |
          npm run check
          npm test
          npm run verify:deploy

      - name: Verify Cloudflare zone and proxied root DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          zone_json="$(curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-urlencode "name=jussbeautifulhair.com" \
            "https://api.cloudflare.com/client/v4/zones")"
          test "$(jq -r '.success' <<<"$zone_json")" = "true"
          zone_id="$(jq -r '[.result[] | select(.name == "jussbeautifulhair.com")] | first | .id // empty' <<<"$zone_json")"
          test -n "$zone_id"

          dns_json="$(curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-urlencode "name=jussbeautifulhair.com" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")"
          test "$(jq -r '.success' <<<"$dns_json")" = "true"
          proxied_count="$(jq '[.result[] | select(.name == "jussbeautifulhair.com" and .proxied == true)] | length' <<<"$dns_json")"
          test "$proxied_count" -ge 1
          echo "Cloudflare preflight verified: root DNS exists and is proxied."

      - name: Dry-run exact front-door deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.frontdoor.toml --dry-run --outdir .wrangler/frontdoor-dry-run

      - name: Activate exact branded-host Worker Route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.frontdoor.toml

      - name: Install pinned live browser verifier
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.61.1

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Prove branded front door in live desktop and mobile browsers
        env:
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          LIVE_STOREFRONT_URL: ${{ env.LIVE_STOREFRONT_URL }}
        run: node scripts/frontdoor-live-playwright.mjs

      - name: Upload live front-door proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontdoor-live-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/frontdoor-live/
          if-no-files-found: warn
          retention-days: 30
