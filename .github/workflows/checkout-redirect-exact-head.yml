name: Checkout Redirect Exact-Head Gate

on:
  pull_request:
    paths:
      - "client/src/pages/Checkout.tsx"
      - "client/src/lib/checkoutRedirect.mjs"
      - "client/src/lib/checkoutRedirect.d.ts"
      - "client/src/lib/checkoutRedirect.d.mts"
      - "tests/checkout-redirect-contract.test.mjs"
      - "docs/CHECKOUT_REDIRECT_FUTUREYOU.md"
      - ".github/workflows/checkout-redirect-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkout-redirect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify exact hosted checkout redirect
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript
        run: npm run check

      - name: Run focused redirect contract
        run: node --test tests/checkout-redirect-contract.test.mjs

      - name: Build storefront
        run: npm run build
