# Dedicated Juss Beautiful Hair test storefront, never a production hostname.
name = "jussbeautifulhair-jbh-sandbox"
main = "worker/entry.ts"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Cloudflare Access account policy 'All preview URLs' restricts this test host to founder owner mailboxes.
preview_urls = true

[build]
command = "npm run build"

[vars]
STORE_ORIGIN = "https://REPLACE-WITH-ACCESS-GATED-TEST-HOST.invalid"
ENABLE_LEGACY_STRIPE_CHECKOUT = "false"
JBH_COMMERCE_PROVIDER = "jusspay"
JBH_STRIPE_COMMERCE_MODE = "test"
JBH_JUSSPAY_LIVE_ENABLED = "false"
JBH_JUSSPAY_SANDBOX_ENABLED = "true"

[[services]]
binding = "JBH_JUSSPAY"
service = "jusspay-jbh-sandbox"

[[ratelimits]]
name = "JBH_RATE_LIMITER"
namespace_id = "11004"
simple = { limit = 120, period = 60 }

[assets]
directory = "dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
