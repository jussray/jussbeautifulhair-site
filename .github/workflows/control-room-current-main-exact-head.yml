name: Control Room Current-Main Exact-Head Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "control-room.manifest.json"
      - ".control-room/repository.manifest.json"
      - ".github/workflows/control-room-current-main-exact-head.yml"
      - ".github/workflows/quality-gate.yml"
      - ".github/workflows/deployment-boundary.yml"
      - "client/src/App.tsx"
      - "client/src/pages/Checkout.tsx"
      - "client/src/pages/success.tsx"
      - "worker/index.ts"
      - "shared/catalog.ts"
      - "README.md"
      - "AGENTS.md"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.toml"
      - ".security/cookies.json"
      - "scripts/lint-storefront.mjs"
      - "scripts/verify-cookie-contract.mjs"
      - "scripts/verify-ai-skills.mjs"
      - "scripts/verify-mcp-config.mjs"
      - "scripts/verify-deployment-boundary.mjs"
      - "scripts/verify-control-room-manifest.mjs"
      - "scripts/verify-control-room-tests.mjs"
      - "docs/CONTROL_ROOM_FUTUREYOU.md"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CONTROL_ROOM_TEST_REPORT_PATH: control-room-test-catalog.json

concurrency:
  group: control-room-current-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-current-main-storefront-contract:
    name: Verify current-main storefront contract
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable target head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify immutable head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Verify merged-PR provenance for current main
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/pulls")"
          PRS_JSON="$prs" node --input-type=module <<'NODE'
          const prs = JSON.parse(process.env.PRS_JSON || "[]");
          const mergedToMain = prs.filter((pr) =>
            pr?.state === "closed" &&
            pr?.merged_at &&
            pr?.base?.ref === "main"
          );
          if (mergedToMain.length === 0) {
            console.error(`Current main SHA ${process.env.EXPECTED_HEAD_SHA} has no merged PR provenance.`);
            process.exit(1);
          }
          console.log(`Merged PR provenance verified: ${mergedToMain.map((pr) => `#${pr.number}`).join(", ")}`);
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript
        run: npm run check

      - name: Run storefront lint contract
        run: npm run lint

      - name: Run repository contract tests
        run: npm test

      - name: Verify cookie contract
        run: npm run verify:cookies

      - name: Verify AI sales and adversarial boundaries
        run: npm run verify:ai-skills

      - name: Verify MCP contract
        run: npm run verify:mcp

      - name: Verify source deployment boundary
        run: npm run security:deploy-boundary

      - name: Build production storefront
        run: npm run build

      - name: Verify built deployment boundary
        run: npm run security:deploy-boundary

      - name: Verify repo-local test catalog
        run: node scripts/verify-control-room-tests.mjs

      - name: Verify Control Room manifests and create sanitized packet
        env:
          CONTROL_ROOM_REPORT_PATH: control-room-verification-packet.json
        run: node scripts/verify-control-room-manifest.mjs

      - name: Upload sanitized Control Room evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-current-main-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            control-room-verification-packet.json
            control-room-test-catalog.json
          if-no-files-found: warn
          retention-days: 30
