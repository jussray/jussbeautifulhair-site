name: Security Rate Limit Exact-Head Gate

on:
  push:
    branches:
      - main
      - 'security/**'
    paths:
      - 'worker/rate-limit.ts'
      - 'worker/entry.ts'
      - 'wrangler.toml'
      - 'wrangler.frontdoor.toml'
      - 'tests/rate-limit-contract.test.mjs'
      - 'scripts/rate-limit-playwright.mjs'
      - '.github/workflows/security-rate-limit-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-rate-limit-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify immutable head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Verify focused rate-limit contract
        run: node --test tests/rate-limit-contract.test.mjs

      - name: Build production storefront
        run: npm run build

      - name: Install pinned runtime and browser verifiers
        run: npm install --no-save --package-lock=false --ignore-scripts wrangler@4.118.0 playwright@1.61.1

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Start exact-head JBH Worker locally
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --config wrangler.frontdoor.toml --ip 127.0.0.1 --port 8792 > "$RUNNER_TEMP/jbh-wrangler.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/jbh-wrangler.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8792/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/jbh-wrangler.log" >&2
          exit 1

      - name: Run JBH API rate-limit browser proof through Wrangler
        env:
          JBH_EDGE_BASE_URL: http://127.0.0.1:8792
        run: node scripts/rate-limit-playwright.mjs

      - name: Stop local JBH Worker
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/jbh-wrangler.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/jbh-wrangler.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/jbh-wrangler.log" ]; then
            cat "$RUNNER_TEMP/jbh-wrangler.log"
          fi
