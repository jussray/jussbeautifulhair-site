name: Paid Order Reconciliation Exact-Head Gate

on:
  pull_request:
    paths:
      - "worker/index.ts"
      - "tests/paid-order-reconciliation-contract.test.mjs"
      - ".github/workflows/paid-order-reconciliation-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paid-order-public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify public checkout reconciliation contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript
        run: npm run check

      - name: Run focused reconciliation contract
        run: node --test tests/paid-order-reconciliation-contract.test.mjs

      - name: Build storefront and Worker
        run: npm run build
